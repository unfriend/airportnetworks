<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --font: "B612", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --bg: #d9e1ec;
  --scene: #0a1731;
  --panel: rgba(243, 246, 251, 0.93);
  --panel-solid: #f3f6fb;
  --ink: #0c1626;
  --muted: #4b5b72;
  --faint: #7a889c;
  --line: rgba(12, 22, 38, 0.14);
  --chip: rgba(12, 22, 38, 0.06);
  --cyan: #00799f;
  --magenta: #b8248f;
  --amber: #a86400;
  --red: #c42c20;
  --green: #12804c;
  --focus: #00799f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #040912; --scene: #040912;
    --panel: rgba(7, 14, 27, 0.80); --panel-solid: #0a1322;
    --ink: #e7eef8; --muted: #95a6bd; --faint: #6c7d94;
    --line: rgba(149, 166, 189, 0.20); --chip: rgba(149, 166, 189, 0.10);
    --cyan: #46d9ff; --magenta: #ff5ad9; --amber: #ffb43b; --red: #ff5a4b; --green: #3ee08f; --focus: #46d9ff;
  }
}
:root[data-theme="dark"] {
  --bg: #040912; --scene: #040912;
  --panel: rgba(7, 14, 27, 0.80); --panel-solid: #0a1322;
  --ink: #e7eef8; --muted: #95a6bd; --faint: #6c7d94;
  --line: rgba(149, 166, 189, 0.20); --chip: rgba(149, 166, 189, 0.10);
  --cyan: #46d9ff; --magenta: #ff5ad9; --amber: #ffb43b; --red: #ff5a4b; --green: #3ee08f; --focus: #46d9ff;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--scene); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; line-height: 1;
  padding: 5px 8px 4px; border-radius: 4px; background: rgba(3, 8, 16, 0.78); color: #f2f6fc;
  will-change: transform, opacity;
}
.lbl b { font-weight: 700; margin-right: 6px; }
.lbl.mag { color: #ffd2f4; box-shadow: inset 2px 0 0 #ff5ad9; }
.lbl.amb { color: #ffe2b0; box-shadow: inset 2px 0 0 #ffb43b; }
.lbl.grn { color: #c9ffe3; box-shadow: inset 2px 0 0 #3ee08f; }
.lbl.cyn { color: #d2f6ff; box-shadow: inset 2px 0 0 #46d9ff; }
#tip {
  position: fixed; left: 0; top: 0; pointer-events: none; font-size: 13px; padding: 6px 9px; border-radius: 5px;
  background: var(--panel-solid); color: var(--ink); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); opacity: 0;
  transition: opacity 0.12s; white-space: nowrap; z-index: 6;
}
#tip b { margin-right: 6px; }

/* top bar */
#top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 4; padding-top: env(safe-area-inset-top, 0px);
  display: flex; align-items: center; gap: 16px; height: calc(58px + env(safe-area-inset-top, 0px));
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#top > * { pointer-events: auto; }
.brand { font-weight: 700; font-size: 15px; color: #e7eef8; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); white-space: nowrap; }
.brand span { font-weight: 400; color: #9fb0c7; margin-left: 8px; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px;
  padding: 8px 14px; font-size: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--cyan); border-color: transparent; color: var(--panel-solid); font-weight: 700; }

/* story / explore panel */
#panel {
  position: fixed; z-index: 3; left: max(22px, env(safe-area-inset-left, 0px));
  top: calc(66px + env(safe-area-inset-top, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(31rem, 38vw); overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-radius: 10px; padding: 26px 28px 28px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); scrollbar-width: thin;
}
#story .ch { display: none; }
#story .ch.on { display: block; }
#story [data-at] { opacity: 0; }
#story h1 { font-size: 56px; line-height: 1.04; margin: 6px 0 14px; letter-spacing: -0.01em; }
#story h2 { font-size: 36px; line-height: 1.1; margin: 0 0 16px; letter-spacing: -0.005em; }
#story p { margin: 0 0 14px; max-width: 34em; }
#story .lede { font-size: 21px; color: var(--muted); margin-bottom: 18px; }
#story .note { color: var(--muted); font-size: 15px; }
#story .step { color: var(--faint); font-size: 14px; margin-bottom: 6px; }
.route-mark { display: block; width: 100%; max-width: 360px; height: 44px; margin: 0 0 4px; overflow: visible; }
.big { font-weight: 700; font-size: 64px; line-height: 1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; font-weight: 400; margin-left: 10px; color: var(--muted); }
.amber { color: var(--amber); } .magenta { color: var(--magenta); } .green { color: var(--green); }
.red { color: var(--red); } .cyan { color: var(--cyan); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin: 10px 0 6px; }
.bars .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.bars .fill { width: 100%; border-radius: 2px 2px 0 0; transform-origin: bottom; }
.bars .v { font-size: 11px; color: var(--ink); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.bars .k { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.bars .bar.hl .k { color: var(--ink); font-weight: 700; }
.caption { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 3px 0; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.concepts { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.concepts li { background: var(--chip); border-radius: 4px; padding: 3px 9px; font-size: 14px; }
.credits { font-size: 13px; color: var(--muted); }
.facts { display: flex; gap: 14px; margin: 4px 0 18px; }
.facts > div { flex: 1; min-width: 0; }
.facts b { display: block; font-size: 27px; line-height: 1.1; color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts small { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.steps { list-style: none; padding: 0; margin: 4px 0 16px; }
.steps li { border-left: 3px solid var(--amber); padding: 1px 0 1px 12px; margin-bottom: 10px; font-size: 15px; }
.steps li b { display: block; color: var(--amber); font-size: 16px; }

/* explore */
#explore { display: none; }
body.exploring #story { display: none; }
body.exploring #explore { display: block; }
.search { position: relative; margin-bottom: 14px; }
.search input, .field input {
  width: 100%; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 6px; padding: 11px 12px; font-size: 16px;
}
.search input::placeholder, .field input::placeholder { color: var(--faint); }
.sugg {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; list-style: none; margin: 0; padding: 4px;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  max-height: 300px; overflow-y: auto; display: none;
}
.sugg.on { display: block; }
.sugg li { padding: 7px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--chip); }
.sugg li b { min-width: 3.2em; }
.sugg li span { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugg li em { font-style: normal; color: var(--faint); font-size: 13px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 9px 10px 10px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cyan); font-weight: 700; }
.pane { display: none; }
.pane.on { display: block; }
.pane h3 { font-size: 26px; line-height: 1.15; margin: 0 0 4px; }
.pane .sub { color: var(--muted); margin: 0 0 16px; }
.empty { color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.quick button, .chips button {
  border: 1px solid var(--line); background: var(--chip); border-radius: 4px; padding: 4px 9px; font-size: 14px;
}
.quick button:hover, .chips button:hover { border-color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 16px; }
dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 18px; }
dl.stats dt { color: var(--muted); font-size: 14px; padding-top: 2px; }
dl.stats dd { margin: 0; font-size: 16px; }
dl.stats dd small { color: var(--muted); font-size: 13px; margin-left: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { position: relative; flex: 1; min-width: 9rem; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.hops { list-style: none; padding: 0; margin: 12px 0 0; counter-reset: hop; }
.hops li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hops li::before { counter-increment: hop; content: counter(hop); color: var(--magenta); font-weight: 700; }
.hops li span { color: var(--muted); font-size: 13px; }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: grid; grid-template-columns: 1.8em 3.4em 1fr auto; gap: 8px; align-items: center; padding: 5px 4px; cursor: pointer; border-radius: 4px; font-size: 15px; }
.rank li:hover { background: var(--chip); }
.rank li i { font-style: normal; color: var(--faint); font-size: 13px; text-align: right; }
.rank li span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li em { font-style: normal; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); font-weight: 700; }
.comm li { cursor: pointer; border-radius: 4px; padding: 6px 6px; display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; }
.comm li:hover { background: var(--chip); }
.comm li[aria-pressed="true"] { background: var(--chip); outline: 1px solid var(--line); }
.comm li em { font-style: normal; color: var(--muted); font-size: 13px; }
.comm li small { grid-column: 2 / 4; color: var(--faint); font-size: 13px; margin-top: -2px; }
input[type="range"] { width: 100%; accent-color: var(--red); }
.result { font-size: 46px; font-weight: 700; line-height: 1; margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
.curve { width: 100%; height: 150px; display: block; margin: 12px 0 4px; }
.closed { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.closed button { border: 1px solid var(--line); background: var(--chip); border-radius: 4px; padding: 3px 8px; font-size: 13px; }

.places li { cursor: pointer; border-radius: 4px; padding: 6px 6px; display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; }
.places li:hover { background: var(--chip); }
.places li[aria-pressed="true"] { background: var(--chip); outline: 1px solid var(--line); }
.places li em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.places li small { grid-column: 2 / 4; color: var(--faint); font-size: 13px; margin-top: -2px; }
.wherelist { list-style: none; padding: 0; margin: 0; }
.wherelist li { display: flex; align-items: center; gap: 8px; }
.wherelist small { color: var(--muted); font-size: 13px; }
.moves { list-style: none; padding: 0; margin: 0; }
.moves li { border-top: 1px solid var(--line); padding: 12px 0; }
.moves li:first-child { border-top: 0; padding-top: 2px; }
.moves .mh { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.moves .mh b { font-size: 16px; }
.moves .mh small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.moves .tag { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--red); margin-left: 6px; font-weight: 700; }
.moves p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.moves .delta { font-size: 13px; margin-top: 6px; }
.moves .btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.moves li.on .btn { border-color: var(--cyan); color: var(--cyan); }
.chips button .sw, .closed button .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.grp-h { font-size: 13px; color: var(--muted); margin: 12px 0 2px; display: flex; align-items: center; gap: 8px; }
.prox-list { list-style: none; padding: 0; margin: 8px 0 0; columns: 2; column-gap: 18px; }
.prox-list li { font-size: 14px; padding: 2px 0; break-inside: avoid; display: flex; gap: 6px; align-items: baseline; }
.prox-list li b { min-width: 4.8em; }
.prox-list li.pt b { color: var(--magenta); }
.prox-list li span { color: var(--faint); font-size: 12px; }

/* bottom bar: story timeline / explore view controls */
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 10px max(22px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 16px;
}
#play { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); flex: none; display: grid; place-items: center; backdrop-filter: blur(6px); }
#play svg { width: 16px; height: 16px; fill: var(--ink); }
#track { flex: 1; position: relative; height: 46px; cursor: pointer; touch-action: none; }
#track .rail { position: absolute; left: 0; right: 0; top: 13px; height: 3px; background: rgba(160, 178, 202, 0.28); border-radius: 2px; }
#track .done { position: absolute; left: 0; top: 13px; height: 3px; background: #46d9ff; border-radius: 2px; }
#track .tick { position: absolute; top: 9px; width: 1px; height: 11px; background: rgba(160, 178, 202, 0.55); }
#track .name { position: absolute; top: 24px; font-size: 12px; color: #9fb0c7; white-space: nowrap; transform: translateX(4px); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
#track .name.cur { color: #ffffff; font-weight: 700; }
#track .knob { position: absolute; top: 8px; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: #46d9ff; box-shadow: 0 0 0 3px rgba(70, 217, 255, 0.25); }
#clock { font-size: 13px; color: #c5d2e3; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
#viewctl { display: none; flex: 1; gap: 14px; align-items: center; flex-wrap: wrap; }
body.exploring #play, body.exploring #track, body.exploring #clock { display: none; }
body.exploring #viewctl { display: flex; }
#viewctl .grp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c5d2e3; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
#viewctl .seg { background: var(--panel); backdrop-filter: blur(6px); }
#viewctl input[type="range"] { width: 110px; accent-color: #46d9ff; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--scene); color: #c5d2e3; z-index: 10; font-size: 15px; transition: opacity 0.6s; }
#loading.gone { opacity: 0; pointer-events: none; }

/* start screen: pick a story */
#picker { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 80px 20px 30px;
  background: radial-gradient(ellipse at center, rgba(5, 10, 20, 0.55), rgba(5, 10, 20, 0.92)); overflow-y: auto; }
#picker[hidden] { display: none; }
body.picking #top { z-index: 9; }
body.picking #panel, body.picking #bar { visibility: hidden; }
#picker .wrap { max-width: 1040px; width: 100%; }
#picker h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 38px); color: #f2f6fc; font-weight: 700; letter-spacing: -0.01em; }
#picker .lede { margin: 0 0 22px; color: #a9b8cc; font-size: 15px; }
#picker .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1020px) { #picker .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { #picker .cards { grid-template-columns: 1fr; } }
#picker .card { display: block; text-align: left; font: inherit; color: #e7eef8; text-decoration: none; cursor: pointer;
  background: rgba(10, 19, 34, 0.88); border: 1px solid rgba(140, 170, 210, 0.25); border-radius: 10px; padding: 20px 20px 18px;
  transition: border-color 0.15s, transform 0.15s; }
#picker .card:hover, #picker .card:focus-visible { border-color: #46d9ff; transform: translateY(-2px); outline: none; }
#picker .card b { display: block; font-size: 21px; margin-bottom: 2px; }
#picker .card .k { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
#picker .card.air .k { color: #46d9ff; } #picker .card.ppi .k { color: #ff5fd2; } #picker .card.cell .k { color: #3ee08f; }
#picker .card span.d { display: block; color: #a9b8cc; font-size: 14px; line-height: 1.45; }
#picker .card em { display: block; margin-top: 12px; font-style: normal; font-size: 13px; color: #7f91a8; }
#picker .card.here { border-color: rgba(70, 217, 255, 0.55); }
#nogl { display: none; position: fixed; inset: 0; place-items: center; padding: 30px; text-align: center; background: var(--scene); color: #e7eef8; z-index: 11; }

.btn[hidden] { display: none; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
#xrmsg {
  position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 7; display: none;
  max-width: min(32rem, 90vw); background: var(--panel-solid); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px; font-size: 14px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
body.xr #labels, body.xr #tip { display: none; }

@media (max-width: 899px) {
  body { font-size: 16px; }
  .brand span { display: none; }
  #panel {
    left: 0; right: 0; width: auto; top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); height: 44%;
    border-radius: 14px 14px 0 0; padding: 18px 18px 22px;
  }
  #story h1 { font-size: 38px; } #story h2 { font-size: 28px; } #story .lede { font-size: 18px; }
  .big { font-size: 46px; }
  #track .name { display: none; }
  #track .name.cur { display: block; }
  #viewctl .grp.opt { display: none; }
  #viewctl { gap: 8px 12px; }
  body.exploring #panel { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); height: 46%; }
}
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } #loading { transition: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="Interactive 3D network"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="tip" role="status"></div>
<div id="xrmsg" role="status"></div>
<header id="top">
  <div class="brand">Networks<span>in four stories</span></div>
  <button class="btn" id="btnOther" type="button" title="Choose another story">Stories</button>
  <div class="spacer"></div>
  <button class="btn" id="btnSound" type="button" hidden aria-pressed="false">Sound on</button>
  <button class="btn" id="btnInstall" type="button" hidden title="Install as an app">Install</button>
  <button class="btn" id="btnAR" type="button" hidden title="Mixed reality: the network floats in your room">Enter AR</button>
  <button class="btn primary" id="btnVR" type="button" hidden title="View in your VR headset">Enter VR</button>
  <button class="btn" id="btnMode" type="button">Explore now</button>
</header>
<aside id="panel">
  <div id="story" aria-live="polite"></div>
  <div id="explore"></div>
</aside>
<footer id="bar">
  <button id="play" type="button" aria-label="Pause"></button>
  <div id="track" role="slider" aria-label="Story position" tabindex="0" aria-valuemin="0" aria-valuemax="232" aria-valuenow="0"></div>
  <div id="clock">0:00 / 3:51</div>
  <div id="viewctl"></div>
</footer>
<div id="picker" hidden role="dialog" aria-labelledby="pickTitle">
  <div class="wrap">
    <h1 id="pickTitle">Networks, in four stories</h1>
    <p class="lede">The same ideas, very different networks. Each story takes a few minutes, then it is yours to explore.</p>
    <div class="cards"></div>
  </div>
</div>
<div id="loading">Loading</div>
<div id="nogl">This app needs WebGL, which this browser has turned off.</div>
<script src="three.min.js"></script>
<script>
'use strict';
// The app shell. Each story lives in stories/<name>.js and is loaded when it is
// first picked. Stories share this page, its renderer and any running headset
// session, so changing story never ends VR or AR.
const HOST = {
  list: [
    { key: 'airports', kick: 'Network theory', title: 'Airports', col: '#46d9ff',
      desc: '3,214 airports and 18,858 routes. Hubs, communities, shortest paths and what happens when airports close.',
      page: "Network theory, told with the world's airports", brand: 'Network theory', sub: "told with the world's airports",
      aria: 'Interactive globe of the world airline network', thing: 'globe', loading: 'Plotting 3,214 airports and 18,858 routes', len: 'Story 3:51 · globe' },
    { key: 'proteins', kick: 'Network medicine', title: 'Proteins', col: '#ff5fd2',
      desc: '254 proteins inside a human cell. Essential hubs, disease modules, drug targets and knockouts.',
      page: 'Network medicine, told with the proteins in a cell', brand: 'Network medicine', sub: 'told with the proteins in a cell',
      aria: 'Interactive 3D cell of protein interactions', thing: 'cell', loading: 'Placing 254 proteins and 375 interactions', len: 'Story 3:32 · cell' },
    { key: 'spatial', kick: 'Spatial interactome', title: 'Cell map', col: '#3ee08f',
      desc: '249 proteins in the compartments of a model cell. Proteins that move, signals that cross the cell, proteins in the wrong place.',
      page: 'Spatial interactome, where proteins meet in a cell', brand: 'Spatial interactome', sub: 'where proteins meet in a cell',
      aria: 'Interactive 3D model of a human cell and its protein network', thing: 'cell', loading: 'Building the cell', len: 'Story 3:40 · cell model' },
    { key: 'lbi', kick: 'LBI Network Medicine', title: 'The future', col: '#ffb43b',
      desc: 'A 3D tour of the Ludwig Boltzmann Institute for Network Medicine: protein machines, the interactome as a map, rare diseases, organs and tissues.',
      page: 'A glimpse into the future of network medicine', brand: 'LBI Network Medicine', sub: 'a glimpse into the future',
      aria: 'Interactive 3D tour of network medicine, from proteins to the whole body', thing: 'scene', loading: 'Building the scenes', len: 'Story 7:48 · 3D tour' },
  ],
  factories: {}, loaded: {}, cur: null, curKey: null, busy: false,
  renderer: null, session: null, mode: null, inputs: [], quiet: false,
  // the one renderer all stories draw with; its internal listeners belong to it, not to a story
  makeRenderer(opts) {
    if (!this.renderer) { this.quiet = true; try { this.renderer = new THREE.WebGLRenderer(opts); } finally { this.quiet = false; } }
    return this.renderer;
  },
  register(key, fn) { this.factories[key] = fn; },
  get picking() { return !document.getElementById('picker').hidden; },
};
// every listener a story adds is noted, so it can be removed when the story is swapped out
const HOST_REC = [];
for (const proto of [EventTarget.prototype, THREE.EventDispatcher.prototype]) {
  const add = proto.addEventListener;
  proto.addEventListener = function (type, fn, opts) {
    // three.js's own listeners on the headset session and the WebGL canvas must outlive any story
    const own = HOST.quiet || type === 'dispose' || (typeof XRSession !== 'undefined' && this instanceof XRSession) || /^webglcontext/.test(type);
    if (HOST.curKey && !own) HOST_REC.push([this, type, fn, opts]);
    return add.call(this, type, fn, opts);
  };
}
HOST.load = key => HOST.loaded[key] || (HOST.loaded[key] = new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'stories/' + key + '.js';
  s.onload = () => res(); s.onerror = () => rej(new Error('Could not load the ' + key + ' story'));
  document.body.appendChild(s);
}));
HOST.teardown = function () {
  const r = this.renderer;
  if (this.cur) {
    try { this.inputs = this.cur.inputs(); } catch (e) { this.inputs = []; }
    try { this.xrPose = this.cur.xrPose(); } catch (e) { this.xrPose = null; }
    try { this.cur.dispose(); } catch (e) { console.warn(e); }
  }
  for (const [t, type, fn, opts] of HOST_REC.splice(0)) t.removeEventListener(type, fn, opts);
  if (r) {
    // keep a running headset session alive while the next story builds
    const blank = new THREE.Scene(), cam = new THREE.PerspectiveCamera();
    r.setAnimationLoop(r.xr.isPresenting ? () => r.render(blank, cam) : null);
    for (let i = 0; i < 2; i++) { const g = r.xr.getController(i); if (g.parent) g.parent.remove(g); g.clear(); }
  }
  for (const id of ['labels', 'story', 'explore', 'viewctl', 'track']) document.getElementById(id).innerHTML = '';
  document.body.classList.remove('exploring');
  document.getElementById('tip').style.opacity = 0;
  document.getElementById('xrmsg').style.display = 'none';
  this.cur = null;
};
HOST.start = async function (key, keepHash) {
  if (this.busy) return;
  const meta = this.list.find(s => s.key === key) || this.list[0];
  if (this.curKey === meta.key && this.cur) { this.closePicker(); return; }
  this.busy = true;
  const ld = document.getElementById('loading');
  ld.textContent = meta.loading; ld.classList.remove('gone');
  try { await this.load(meta.key); } catch (e) { ld.textContent = e.message; this.busy = false; return; }
  this.teardown();
  if (!keepHash) history.replaceState(null, '', '#' + meta.key);
  document.getElementById('gl').setAttribute('aria-label', meta.aria);
  document.getElementById('btnAR').title = `Mixed reality: the ${meta.thing} floats in your room`;
  document.getElementById('nogl').textContent = `This ${meta.thing} needs WebGL, which this browser has turned off.`;
  document.querySelectorAll('#picker .card').forEach(c => c.classList.toggle('here', c.dataset.story === meta.key));
  this.curKey = meta.key;
  this.chrome(this.picking);
  this.cur = this.factories[meta.key](this);
  this.busy = false;
  this.closePicker();
};
// from the headset menu: change story after the click that asked for it has finished
HOST.go = key => setTimeout(() => HOST.start(key), 0);
// the address says where you are, so it can be shared: #stories on the Stories
// screen (page or headset), #airports, #proteins or #spatial in a story
HOST.setUrl = function (stories) {
  const h = stories ? '#stories' : '#' + this.curKey;
  if (location.hash !== h) history.replaceState(null, '', h);
  this.chrome(stories);
};
// the title in the tab and the top bar: the app on the Stories screen, the story inside a story
HOST.chrome = function (stories) {
  const meta = this.list.find(s => s.key === this.curKey), app = stories || !meta;
  document.title = app ? 'Networks, in four stories' : meta.page;
  document.querySelector('#top .brand').innerHTML = app ? 'Networks<span>in four stories</span>' : `${meta.brand}<span>${meta.sub}</span>`;
};
HOST.openPicker = function () {
  const pk = document.getElementById('picker');
  if (!pk.hidden) return;
  pk.hidden = false; document.body.classList.add('picking');
  HOST.setUrl(true);
  window.dispatchEvent(new Event('storypause'));
  setTimeout(() => (pk.querySelector('.card.here') || pk.querySelector('.card')).focus(), 200);
};
HOST.closePicker = function () {
  const pk = document.getElementById('picker');
  if (pk.hidden) return;
  pk.hidden = true; document.body.classList.remove('picking');
  HOST.setUrl(false);
};

(function boot() {
  const pk = document.getElementById('picker');
  pk.querySelector('.cards').innerHTML = HOST.list.map(s => `<button class="card" type="button" data-story="${s.key}">
    <span class="k" style="color:${s.col}">${s.kick}</span><b>${s.title}</b><span class="d">${s.desc}</span><em>${s.len}</em></button>`).join('');
  pk.addEventListener('click', ev => {
    const c = ev.target.closest('[data-story]');
    if (!c) return;
    if (c.dataset.story === HOST.curKey) { HOST.closePicker(); window.dispatchEvent(new Event('storyrestart')); } else HOST.start(c.dataset.story);
  });
  document.getElementById('btnOther').addEventListener('click', () => HOST.openPicker());
  // top-bar buttons close the start screen; Enter VR/AR leaves it to the headset, which then shows the Stories menu
  document.getElementById('top').addEventListener('click', ev => {
    if (ev.target.closest('#btnVR, #btnAR')) { if (HOST.picking) HOST.landingVR = true; return; }
    if (ev.target.closest('button') && !ev.target.closest('#btnOther')) HOST.closePicker();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') HOST.closePicker(); });
  // which story to load first: #airports, #proteins or #spatial (old links to proteins.html and spatial.html forward here)
  const hp = new URLSearchParams(location.hash.slice(1));
  const key = HOST.list.map(s => s.key).find(k => hp.has(k)) || 'airports';
  // the Stories screen is the landing page (no address, or #stories); a shared story link opens that story
  HOST.start(key, true).then(() => {
    if (!HOST.list.some(s => hp.has(s.key)) && !hp.has('t') && !hp.has('explore')) HOST.openPicker();
  });
})();

// ------------------------------------------------------------ installable app --
// The service worker caches the app for offline use; browsers that support it
// (Chrome, Edge, Meta Quest Browser, Android) then offer to install it.
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err)));
}
let installPrompt = null;
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  installPrompt = ev;
  document.getElementById('btnInstall').hidden = false;
});
window.addEventListener('appinstalled', () => { installPrompt = null; document.getElementById('btnInstall').hidden = true; });
document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => null);
  installPrompt = null;
  document.getElementById('btnInstall').hidden = true;
});
</script>
</body>
</html>
