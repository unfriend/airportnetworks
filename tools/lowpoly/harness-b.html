<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miniatures, batch b</title>
<!--
  The low-poly miniatures of models-b.js in a grid, lit as the app's props are, turning slowly.
  Serve the repository root on port 8123, then open tools/lowpoly/harness-b.html. Query:
    still          no turning (for screenshots); az=0.6 and el=0.42 set the view (radians)
    page=0, per=12 which miniatures (in the registry's order), cols=4 the grid's columns
    keys=a.b,c.d   only these; big shows one large
  window.__ready is true after the first frame; window.__stats holds { key: { tris, ms, meshes } }.
  Screenshots (Playwright, from the repository root):
    const { chromium } = await import('playwright');
    const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
    const pg = await b.newPage({ viewport: { width: 1280, height: 760 } });
    await pg.goto('http://127.0.0.1:8123/tools/lowpoly/harness-b.html?still&page=0');
    await pg.waitForFunction('window.__ready === true'); await pg.screenshot({ path: '/tmp/fix-shots/lowpoly-b-1.png' });
-->
<style>
  html, body { margin: 0; height: 100%; background: #040912; color: #e7eef8; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #grid { position: fixed; inset: 0; display: grid; gap: 0; }
  .cell { position: relative; border: 1px solid #101a2a; }
  .cell b { position: absolute; left: 8px; bottom: 6px; font-weight: 600; }
  .cell small { position: absolute; right: 8px; bottom: 7px; color: #8e98ab; font-size: 11px; }
  .cell i { position: absolute; left: 8px; top: 6px; color: #8e98ab; font-style: normal; font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grid"></div>
<script src="../../three.min.js"></script>
<script src="models-b.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search), num = (k, d) => Q.has(k) ? +Q.get(k) : d;
  const still = Q.has('still'), big = Q.has('big');
  let keys = Object.keys(LOWPOLY_MODELS);
  if (Q.get('keys')) keys = Q.get('keys').split(',').filter(k => LOWPOLY_MODELS[k]);
  const per = big ? 1 : num('per', 12), page = num('page', 0);
  keys = keys.slice(page * per, page * per + per);
  const cols = big ? 1 : num('cols', Math.min(4, keys.length)), rows = Math.ceil(keys.length / cols);
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setScissorTest(true);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
  const stats = {}, items = [];
  for (const k of keys) {
    const m = LOWPOLY_MODELS[k], t0 = performance.now(), grp = m.build(THREE), ms = performance.now() - t0;
    let tris = 0; grp.traverse(o => { if (o.isMesh) tris += o.geometry.attributes.position.count / 3; });
    stats[k] = { tris, ms: +ms.toFixed(1), meshes: grp.children.length };
    const scene = new THREE.Scene();
    // the app's light: a hemisphere light and a directional one from over the viewer's left shoulder
    scene.add(new THREE.HemisphereLight(0xdde8ff, 0x1a2233, 0.85));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-0.5, 0.9, 1.0); scene.add(sun);
    const table = new THREE.Mesh(new THREE.CircleGeometry(0.78, 40), new THREE.MeshStandardMaterial({ color: 0x0d1626, roughness: 0.9 }));
    table.rotation.x = -Math.PI / 2; table.position.y = -0.002; scene.add(table);
    scene.add(grp);
    const div = document.createElement('div');
    div.className = 'cell';
    div.innerHTML = `<i>${k}</i><b>${m.name}</b><small>${tris} tris · ${stats[k].ms} ms</small>`;
    grid.appendChild(div);
    items.push({ scene, grp, div });
  }
  window.__stats = stats;
  const t0 = performance.now(), az0 = num('az', 0.6), el = num('el', 0.42);
  function frame() {
    const W = innerWidth, H = innerHeight;
    renderer.setSize(W, H, false);
    renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H);
    renderer.setClearColor(0x040912, 1); renderer.clear();
    const az = still ? az0 : az0 + (performance.now() - t0) / 1000 * 0.35;
    for (const it of items) {
      const r = it.div.getBoundingClientRect(), h = r.height - 22;   // leave the label's line
      renderer.setViewport(r.left, H - r.top - h, r.width, h); renderer.setScissor(r.left, H - r.top - h, r.width, h); renderer.clearDepth();
      camera.aspect = r.width / h;
      const d = 2.9 / Math.min(1, camera.aspect * 0.9);
      camera.position.set(Math.sin(az) * Math.cos(el) * d, 0.45 + Math.sin(el) * d, Math.cos(az) * Math.cos(el) * d);
      camera.lookAt(0, 0.45, 0); camera.updateProjectionMatrix();
      renderer.render(it.scene, camera);
    }
    window.__ready = true;
    if (!still) requestAnimationFrame(frame);
  }
  renderer.autoClear = false;
  frame();
  addEventListener('resize', () => { if (still) frame(); });
})();
</script>
</body>
</html>
