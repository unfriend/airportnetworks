<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Set harness</title>
<style>
html, body { margin: 0; background: #040912; overflow: hidden; font-family: sans-serif; }
canvas { display: block; }
.l { position: absolute; left: 0; top: 0; color: #e7eef8; font: 13px/1.25 sans-serif; background: rgba(3,8,16,0.82); padding: 3px 7px 3px 6px;
  border-left: 3px solid #9fb0c6; white-space: nowrap; pointer-events: none; border-radius: 3px; }
.l b { margin-right: 6px; } .l.mag { border-color: #ff5ad9; } .l.amb { border-color: #ffb43b; } .l.grn { border-color: #3ee08f; } .l.cyn { border-color: #46d9ff; }
#info { position: absolute; right: 8px; bottom: 6px; color: #6c7d94; font: 12px monospace; }
</style>
<script src="../../three.min.js"></script>
<script src="../lbi/kit.js"></script>
<script>const SETS = {};</script>
<script src="sets/data.js"></script>
<script src="sets/look.js"></script>
<script src="../micro/sets/organs.js"></script>
<script src="../lbi/sets/body.js"></script>
<script src="../lbi/sets/tissue.js"></script>
<script>
// Test harness for one set of the aging ovary story (serve the repository root, open /tools/ovary/harness.html):
// harness.html?set=atp&p=atp_build:1,atp_turns:0.5&t=3&cam=30,15,3.6,0,0,0&anim=1
// the tour's body and tissue sets (tools/lbi/sets/), the microanatomy story's organ models (tools/micro/sets/organs.js), the
// data and the shared look (sets/data.js, sets/look.js) are always loaded: set=body or set=tissue shows one alone;
// with=body also shows the body behind the set (the organ set's first shot)
// set=body, set=tissue or set=organs shows one alone
const Q = new URLSearchParams(location.search);
const FILE = Q.get('set');
if (FILE !== 'body' && FILE !== 'tissue' && FILE !== 'organs') document.write(`<script src="sets/${FILE}.js?v=${Date.now()}"><\/script>`);
</script>
</head><body>
<div id="info"></div>
<script>
'use strict';
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message)));
const K = makeKit(THREE);
const key = Q.get('set');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
renderer.setClearColor(0x040912, 1);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, W / H, 0.01, 200);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x1a2233, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-0.5, 0.6, 1); camera.add(sun);
const t0 = performance.now();
const set = SETS[key](K);
if (set.finish && !Q.get('nofinish')) set.finish();   // a set that builds in slices (the motor set's heart, the organ models) builds now
const buildMs = performance.now() - t0;
scene.add(set.group);
const S = Object.assign({}, set.params);
if (S[key + '_a'] === undefined) S[key + '_a'] = 1;
// (with=<set>: another set drawn in the same frame, e.g. the body behind the organ; its params come from p too)
const W2 = Q.get('with'), set2 = W2 ? SETS[W2](K) : null;
if (set2) { scene.add(set2.group); Object.assign(S, set2.params); S[W2 + '_a'] = 1; }
for (const kv of (Q.get('p') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); S[k] = parseFloat(v); }
// (cam: a view of the set by name, or six numbers)
const camQ = Q.get('cam'), camArr = camQ ? (set.cam && set.cam[camQ] ? set.cam[camQ] : camQ.split(',').map(Number)) : (set.cam && set.cam.default) || [0, 15, 3.6, 0, 0, 0];
function place(c) {
  const [az, el, d, tx, ty, tz] = c, A = az * Math.PI / 180, E = el * Math.PI / 180;
  camera.position.set(tx + d * Math.cos(E) * Math.sin(A), ty + d * Math.sin(E), tz + d * Math.cos(E) * Math.cos(A));
  camera.up.set(0, 1, 0); camera.lookAt(tx, ty, tz);
}
// (a label's text may be a function returning [bold, rest]: read again every frame)
const ltext = L => (typeof L.text === 'function' ? L.text() : L.text);
const labels = (set.labels || []).map(L => { const el = document.createElement('div'); el.className = 'l ' + (L.cls || ''); const tx = ltext(L); el.innerHTML = `<b>${tx[0]}</b>${tx[1] || ''}`; document.body.appendChild(el); return { L, el }; });
const anchor = a => (typeof a === 'function' ? a() : typeof a === 'string' ? (typeof set.anchors[a] === 'function' ? set.anchors[a]() : set.anchors[a]) : a);
let t = parseFloat(Q.get('t') || '0'), last = performance.now(), frames = 0, ms = 0;
const v = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (Q.get('anim')) t += dt;
  K.U.uTime.value = t;
  K.U.uPx.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y * 0.5;
  place(camArr);
  set.setAlpha(S[key + '_a']);
  const a = performance.now();
  set.update(S, t, dt);
  if (set2) { set2.setAlpha(S[W2 + '_a']); set2.update(S, t, dt); }
  renderer.render(scene, camera);
  ms += performance.now() - a; frames++;
  for (const { L, el } of labels) {
    const al = L.alpha ? L.alpha(S) : 1;
    el.style.opacity = al;
    if (al <= 0) continue;
    if (typeof L.text === 'function') { const tx = L.text(); el.innerHTML = `<b>${tx[0]}</b>${tx[1] || ''}`; }
    const p = anchor(L.at);
    v.set(p[0], p[1], p[2]).applyMatrix4(set.group.matrixWorld).project(camera);
    el.style.transform = `translate(${((v.x * 0.5 + 0.5) * W + 8).toFixed(1)}px, ${((-v.y * 0.5 + 0.5) * H - 10).toFixed(1)}px)`;
  }
  let tris = renderer.info.render.triangles, calls = renderer.info.render.calls, pts = renderer.info.render.points, lns = renderer.info.render.lines;
  document.getElementById('info').textContent = `build ${buildMs.toFixed(0)} ms · ${calls} calls · ${tris} tris · ${pts} pts · ${lns} lines · t=${t.toFixed(2)}`;
  window.__stats = { buildMs, calls, tris, pts, lns, frameMs: ms / frames };
  window.__ready = true;
  if (Q.get('anim') || frames < 3) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
