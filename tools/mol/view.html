<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protein models</title>
<!-- A harness for tools/mol/build.py's models (not part of the app): serve the repository's folder and open
     tools/mol/view.html?dir=<folder of the .mol files and index.json, relative to this page or absolute>&model=<name>.
     It runs the shared engine's own model parts (tools/engine/e2_scene.js: MOLS molLoad molParse molMaterial molMesh
     molInstanced), taken from that file as it loads, so what it shows is what a story draws.
     More: &view=grid (every look at every level side by side; the default) or single (&look=surface|cartoon|balls
     &lod=auto|0|1|2), &hl=A:60-A:152 (light a range), &crowd=200 (copies of the lowest level, one draw), &yaw=30,
     &pitch=10 (degrees). Drag turns, the wheel zooms. tools/mol/README.md, "Looking at a model". -->
<style>
  :root { --bg: #0b1020; --fg: #dfe6f3; --dim: #8a96ad; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #bar select, #bar button { background: #1a2238; color: var(--fg); border: 1px solid #2d3a5a; border-radius: 4px; padding: 3px 7px; font: inherit; }
  #bar button.on { background: #35507f; }
  #info { position: fixed; left: 8px; bottom: 8px; color: var(--dim); white-space: pre; }
  .tag { position: fixed; transform: translate(-50%, 0); color: var(--dim); font-size: 12px; text-align: center; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"></div>
<div id="info">loading</div>
<script src="../../three.min.js"></script>
<script>
'use strict';
(async function () {
  const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
  const dir = (Q.get('dir') || '').replace(/\/$/, '');
  if (!dir) throw new Error('Give the models\' folder: view.html?dir=<folder with index.json>&model=<name> (tools/mol/README.md)');
  const want = { model: Q.get('model'), view: Q.get('view') || 'grid', look: Q.get('look') || 'surface', lod: Q.get('lod') || 'auto' };
  // the engine's own parts, as a story pastes them
  const text = async u => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(u + ': ' + r.status); return r.text(); };
  const bits = (await text('../engine/e2_scene.js')).split(/^\/\/#part (\S+)\n/m), P = {};
  for (let i = 1; i < bits.length; i += 2) P[bits[i]] = bits[i + 1];
  const LV = new THREE.Vector3(), GL = {};
  const api = new Function('THREE', 'LV', 'GL', (await text('../engine/kit.js')) + '\nconst K = makeKit(THREE);\n' +
    ['MOLS', 'molLoad', 'molParse', 'molMaterial', 'molMesh', 'molInstanced'].map(n => P[n]).join('\n') +
    '\nreturn { K, MOLS, molLoad, molReady, molWait, molMesh, molInstanced };')(THREE, LV, GL);
  const { K, MOLS } = api;
  const index = JSON.parse(await text(dir + '/index.json')), names = index.models.map(m => m.name);
  const name = names.includes(want.model) ? want.model : names[0], meta = index.models.find(m => m.name === name);
  const t0 = performance.now();
  await new Promise(done => { api.molLoad(f => dir + '/' + f, [name]); const w = () => (api.molWait() ? setTimeout(w, 5) : done()); w(); });
  const loadMs = performance.now() - t0;
  // the page: a plain renderer (this harness is no story), the app's scene colour, the sun over the left shoulder
  const renderer = GL.renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0b1020, 1);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100), set = K.newSet('view');
  scene.add(set.group);
  const tags = [], tag = (txt, p) => { const d = document.createElement('div'); d.className = 'tag'; d.textContent = txt; document.body.appendChild(d); tags.push([d, p]); };
  const looks = ['surface', 'cartoon', 'balls'].filter(l => l === 'balls' || meta.looks[l]);
  const items = [];
  let dist = 3.2;
  if (want.view === 'grid') {
    looks.forEach((l, r) => [0, 1, 2].forEach(i => {
      const o = api.molMesh(set, name, { look: l, lod: i, width: 0.9 });
      o.group.position.set((i - 1) * 1.15, (looks.length - 1) / 2 * 1.05 - r * 1.05, 0);
      set.group.add(o.group); items.push(o);
      const tris = l === 'balls' ? `${meta.residues} balls` : `${meta.looks[l][i].toLocaleString('en-US')} triangles`;
      tag(`${l} LOD${i}: ${tris}`, o.group.position.clone().add(new THREE.Vector3(0, -0.5, 0)));
    }));
    dist = 1.2 + looks.length * 1.75;
  } else if (Q.get('crowd')) {
    const n = +Q.get('crowd'), c = api.molInstanced(set, name, { look: want.look, lod: want.lod === 'auto' ? 2 : +want.lod, count: n, width: 0.18 }), r = K.rng(3);
    for (let i = 0; i < n; i++) c.setAt(i, new THREE.Vector3((r() - 0.5) * 2.4, (r() - 0.5) * 1.5, (r() - 0.5) * 1.2), new THREE.Quaternion().setFromEuler(new THREE.Euler(r() * 6, r() * 6, r() * 6)), 0.8 + 0.4 * r());
    set.group.add(c.mesh);
  } else {
    const o = api.molMesh(set, name, { look: want.look, lod: want.lod === 'auto' ? 'auto' : +want.lod, width: 1.6 });
    set.group.add(o.group); items.push(o);
    const hl = Q.get('hl');
    if (hl) { const [a, b] = hl.split('-'); o.setHighlight(a, b, '#ffd24d', 1); }
  }
  // the bar: models, views, looks, levels
  const go = ch => { const u = new URLSearchParams(location.search); for (const k in ch) u.set(k, ch[k]); location.search = u.toString(); };
  const sel = document.createElement('select');
  names.forEach(n => sel.add(new Option(n, n, false, n === name)));
  sel.onchange = () => go({ model: sel.value });
  $('#bar').appendChild(sel);
  const btn = (txt, on, ch) => { const b = document.createElement('button'); b.textContent = txt; b.className = on ? 'on' : ''; b.onclick = () => go(ch); $('#bar').appendChild(b); };
  btn('grid', want.view === 'grid', { view: 'grid' });
  looks.forEach(l => btn(l, want.view === 'single' && want.look === l, { view: 'single', look: l }));
  ['auto', '0', '1', '2'].forEach(l => btn('LOD ' + l, want.view === 'single' && want.lod === l, { view: 'single', lod: l }));
  // turning and zooming
  let yaw = +(Q.get('yaw') || 20) * Math.PI / 180, pitch = +(Q.get('pitch') || 10) * Math.PI / 180, drag = null;
  addEventListener('pointerdown', e => { if (e.target.tagName === 'CANVAS') drag = [e.clientX, e.clientY]; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointermove', e => { if (!drag) return; yaw += (e.clientX - drag[0]) * 0.01; pitch += (e.clientY - drag[1]) * 0.01; drag = [e.clientX, e.clientY]; });
  addEventListener('wheel', e => { dist *= Math.exp(e.deltaY * 0.001); }, { passive: true });
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  const v = new THREE.Vector3();
  let frames = 0, tf = performance.now(), fps = 0;
  (function frame() {
    requestAnimationFrame(frame);
    K.U.uTime.value = performance.now() / 1000;
    for (const o of items) o.group.rotation.set(pitch, yaw, 0);
    camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();
    LV.set(-0.5, 0.6, 1.0).normalize().applyQuaternion(camera.quaternion);
    renderer.render(scene, camera);
    for (const [d, p] of tags) { v.copy(p).project(camera); d.style.left = (v.x + 1) / 2 * innerWidth + 'px'; d.style.top = (1 - v.y) / 2 * innerHeight + 'px'; }
    frames++;
    if (performance.now() - tf > 500) { fps = frames * 1000 / (performance.now() - tf); frames = 0; tf = performance.now(); }
    const lod = items.length === 1 && want.lod === 'auto' ? `  level ${items[0].lod()}` : '';
    $('#info').textContent = `${meta.title} (${meta.credit})  ${meta.residues} residues, ${(meta.bytes / 1024).toFixed(0)} KB, loaded and parsed in ${loadMs.toFixed(0)} ms\n` +
      `drawn: ${renderer.info.render.triangles.toLocaleString('en-US')} triangles, ${renderer.info.render.calls} draws${lod}, ${fps.toFixed(0)} fps`;
    window.molReady = true;
  })();
})().catch(e => { document.querySelector('#info').textContent = String(e); console.error(e); });
</script>
</body>
</html>
