<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station icons</title>
<!-- The stations' icons (shared.js, "station icons") in a grid, lit as in a headset, on the app's dark background.
     Served next to the app: http://127.0.0.1:8123/tools/icons.html
       ?keys=airports,pet,qubits   only these (any key without a model of its own shows the fallback)
       &cols=3                     columns (default: 5)
       &t=3.5                      time in seconds, frozen (default: turning)
       &fallback                   adds a story with no model of its own
       &turns=4                    each icon four times, a quarter of a turn apart (a row each with &cols=4)
     The app runs in a hidden frame (its HOST.list and HOST.collab.icon), so the icons are exactly the shell's. -->
<style>
  html, body { margin: 0; height: 100%; background: #040912; color: #e7eef8; overflow: hidden;
    font: 14px B612, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    font-size: 15px; color: #95a6bd; border-bottom: 1px solid rgba(140, 170, 210, 0.18); }
  header b { color: #e7eef8; }
  .name { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; line-height: 1.25; pointer-events: none; }
  .name b { display: block; font-size: 15px; color: #e7eef8; }
  .name span { font-size: 12px; }
  iframe { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; border: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header><b>Station icons</b><span id="note">loading the app...</span></header>
<iframe id="app" src="../index.html#stories" tabindex="-1" aria-hidden="true"></iframe>
<script>
'use strict';
(async function () {
  const q = new URLSearchParams(location.search), frame = document.getElementById('app'), cv = document.getElementById('gl'), HEAD = 40;
  // wait for the app in the frame (not hidden: a hidden frame gets no animation frames, and the app may want them)
  let W = null;
  for (let k = 0; k < 600 && !W; k++) {
    await new Promise(r => setTimeout(r, 100));
    // (HOST is a top-level const of the app's page, not a property of its window)
    try { const H = frame.contentWindow.eval('typeof HOST !== "undefined" && HOST'); if (H && H.collab && H.collab.icon && H.list) W = H; } catch (e) { /* not yet */ }
  }
  if (!W) { document.getElementById('note').textContent = 'The app did not load (or its shell has no station icons).'; return; }
  const T = frame.contentWindow.THREE, list = W.list;
  let keys = q.get('keys') ? q.get('keys').split(',').map(s => s.trim()).filter(Boolean) : list.map(m => m.key);
  if (q.has('fallback')) keys = keys.concat('sixteenth');
  const turns = Math.max(1, +q.get('turns') || 1), shown = keys.flatMap(k => Array.from({ length: turns }, (_, j) => [k, j * 12 / turns]));
  const cols = +q.get('cols') || Math.min(5, shown.length), rows = Math.ceil(shown.length / cols), frozen = q.has('t') ? +q.get('t') : null;
  const r = new T.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  r.setClearColor(0x040912, 1);
  // all in one scene (their glows overlap as they would in a room), side by side, seen through a long lens; posed as
  // in the room (shared.js: iconStep) the top of each is tipped 0.2 rad towards you beyond your line of sight, and
  // its light is in view space, so a level camera sees what someone below it sees
  const sc = new T.Scene(), cam = new T.PerspectiveCamera(10, 1, 1, 100), CELL = 0.5;
  const cells = shown.map(([key, dt], i) => {
    const m = list.find(x => x.key === key), I = W.collab.icon(key);
    sc.add(I.g);
    const el = document.createElement('div');
    el.className = 'name';
    el.innerHTML = m ? `<b>${m.title}</b><span style="color:${m.col}">${key} &middot; ${m.col}</span>` : `<b>A new story</b><span>${key} &middot; fallback</span>`;
    document.body.appendChild(el);
    return { key, I, el, i, dt, tris: I.mesh.geometry.attributes.position.count / 3 };
  });
  const one = cells.filter(c => !c.dt);
  document.getElementById('note').textContent = `${keys.length} icons, ${one.map(c => c.tris).reduce((a, b) => a + b, 0)} triangles in all ` +
    `(${Math.min(...one.map(c => c.tris))} to ${Math.max(...one.map(c => c.tris))} each), one turn in 12 s` + (frozen !== null ? `, at ${frozen} s` : '') +
    (turns > 1 ? `, ${turns} views a ${turns === 4 ? 'quarter' : '1/' + turns} of a turn apart` : '');
  window.__icons = one.map(c => ({ key: c.key, tris: c.tris }));
  function layout() {
    const w = innerWidth, h = innerHeight, cw = w / cols, ch = (h - HEAD) / rows, px = Math.min(cw, ch - 44), s = CELL / px;   // (metres per pixel)
    r.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
    cam.position.set(0, 0, h * s / 2 / Math.tan(5 * Math.PI / 180)); cam.lookAt(0, 0, 0);
    cells.forEach(c => {
      const x = (c.i % cols + 0.5) * cw, y = HEAD + Math.floor(c.i / cols) * ch + (ch - 44) / 2 + 4;
      c.I.g.position.set((x - w / 2) * s, (h / 2 - y) * s, 0);
      c.el.style.left = x + 'px'; c.el.style.top = (y + px / 2 - 6) + 'px';
    });
  }
  function draw(now) {
    const t = frozen !== null ? frozen : now / 1000;
    for (const c of cells) c.I.pose(0, 0.2, t + c.dt);
    r.render(sc, cam);
    document.body.dataset.ready = '1';
    if (frozen === null) requestAnimationFrame(draw);
  }
  addEventListener('resize', () => { layout(); if (frozen !== null) requestAnimationFrame(draw); });
  layout();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
