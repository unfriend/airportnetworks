<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Set harness</title>
<style>
html, body { margin: 0; background: #040912; overflow: hidden; font-family: sans-serif; }
canvas { display: block; }
.l { position: absolute; left: 0; top: 0; color: #e7eef8; font: 13px/1.25 sans-serif; background: rgba(3,8,16,0.82); padding: 3px 7px 3px 6px;
  border-left: 3px solid #9fb0c6; white-space: nowrap; pointer-events: none; border-radius: 3px; }
.l b { margin-right: 6px; } .l.mag { border-color: #ff5ad9; } .l.amb { border-color: #ffb43b; } .l.grn { border-color: #3ee08f; } .l.cyn { border-color: #46d9ff; }
#info { position: absolute; right: 8px; bottom: 6px; color: #6c7d94; font: 12px monospace; }
</style>
<script src="../../three.min.js"></script>
<script src="../lbi/kit.js"></script>
<script>
// Test harness for the robot gang (serve the repository root, open /tools/robots/harness.html):
// harness.html?set=robots&p=robots_rule:2,robots_links:1&cam=35,52,8.6,0,0.1,0.15&fov=50&anim=1
//   room=box|real   a bare 4 m x 5 m box, or an L-shaped room as a headset might find it (a couch, a cabinet, one wall missing)
//   walk=x,z        send the avatar there;  crumbs=x,z  spill a pile there;  eye=x,y,z  the eye passed to see() (default: the camera)
//   sim=s           run the simulation s seconds (steps of 1/60 s) before the first picture;  anim=1  then run in real time
const SETS = {};
const Q = new URLSearchParams(location.search);
const FILE = Q.get('set') || 'robots';
document.write(`<script src="sets/${FILE}.js?v=${Date.now()}"><\/script>`);
// the rooms the harness can give the set (the same as the checks use)
const ROOMS = {
  box: { kind: 'box', floor: [[-2, -2.5], [2, -2.5], [2, 2.5], [-2, 2.5]], walls: [[-2, -2.5, 2, -2.5, 2.5], [2, -2.5, 2, 2.5, 2.5], [2, 2.5, -2, 2.5, 2.5], [-2, 2.5, -2, -2.5, 2.5]], blocks: [] },
  real: { kind: 'real', floor: [[-2.6, -2.1], [2.4, -2.1], [2.4, 0.4], [0.3, 0.4], [0.3, 2.6], [-2.6, 2.6]],
    walls: [[-2.6, -2.1, 2.4, -2.1, 2.4], [2.4, -2.1, 2.4, 0.4, 2.4], [2.4, 0.4, 0.3, 0.4, 2.4], [0.3, 2.6, -2.6, 2.6, 2.4], [-2.6, 2.6, -2.6, -2.1, 2.4]],
    blocks: [{ poly: [[-2.5, -2.0], [-0.6, -2.0], [-0.6, -1.12], [-2.5, -1.12]], h: 0.8, label: 'couch' }, { poly: [[1.6, -2.05], [2.35, -2.05], [2.35, -1.6], [1.6, -1.6]], h: 0.9, label: 'storage' }] },
};
</script>
</head><body>
<div id="info"></div>
<script>
'use strict';
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message)));
const K = makeKit(THREE);
const key = Q.get('set') || 'robots';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
renderer.setClearColor(0x040912, 1);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(+(Q.get('fov') || 50), W / H, 0.03, 3000);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x1a2233, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-0.5, 0.6, 1); camera.add(sun);
const t0 = performance.now();
const set = SETS[key](K);
if (set.finish) set.finish();
const buildMs = performance.now() - t0;
scene.add(set.group);
window.__set = set;
const S = Object.assign({}, set.params);
window.__S = S;
if (S[key + '_a'] === undefined) S[key + '_a'] = 1;
for (const kv of (Q.get('p') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); S[k] = parseFloat(v); }
if (Q.get('room') && ROOMS[Q.get('room')]) set.setRoom(ROOMS[Q.get('room')]);
const pair = s => (s ? s.split(',').map(Number) : null);
if (Q.get('walk')) set.walkTo(...pair(Q.get('walk')));
if (Q.get('crumbs')) set.crumbs(...pair(Q.get('crumbs')));
const eyeQ = pair(Q.get('eye'));
const camArr = (Q.get('cam') ? Q.get('cam').split(',').map(Number) : (set.cam && set.cam.default) || [0, 15, 3.6, 0, 0, 0]);
function place(c) {
  const [az, el, d, tx, ty, tz] = c, A = az * Math.PI / 180, E = el * Math.PI / 180;
  camera.position.set(tx + d * Math.cos(E) * Math.sin(A), ty + d * Math.sin(E), tz + d * Math.cos(E) * Math.cos(A));
  camera.up.set(0, 1, 0); camera.lookAt(tx, ty, tz);
}
const labels = (set.labels || []).map(L => { const el = document.createElement('div'); el.className = 'l ' + (L.cls || ''); el.innerHTML = `<b>${L.text[0]}</b>${L.text[1] || ''}`; document.body.appendChild(el); return { L, el }; });
const anchor = a => (typeof a === 'function' ? a() : typeof a === 'string' ? (typeof set.anchors[a] === 'function' ? set.anchors[a]() : set.anchors[a]) : a);
let t = parseFloat(Q.get('t') || '0'), last = performance.now(), frames = 0, ms = 0;
const tellEye = () => { if (set.see) set.see(eyeQ || set.group.worldToLocal(camera.position.clone()).toArray()); };
// run the simulation fast before the first picture
place(camArr); tellEye();
for (let k = 0, n = Math.round(+(Q.get('sim') || 0) * 60); k < n; k++) { set.update(S, t, 1 / 60); t += 1 / 60; }
const v = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const run = Q.get('anim') ? dt : 0;
  t += run;
  K.U.uTime.value = t;
  K.U.uPx.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y * 0.5;
  place(camArr);
  set.setAlpha(S[key + '_a']);
  const a = performance.now();
  tellEye();
  set.update(S, t, run);
  renderer.render(scene, camera);
  ms += performance.now() - a; frames++;
  for (const { L, el } of labels) {
    const al = L.alpha ? L.alpha(S) : 1;
    el.style.opacity = al;
    if (al <= 0) continue;
    const p = anchor(L.at);
    v.set(p[0], p[1], p[2]).applyMatrix4(set.group.matrixWorld).project(camera);
    el.style.transform = `translate(${((v.x * 0.5 + 0.5) * W + 8).toFixed(1)}px, ${((-v.y * 0.5 + 0.5) * H - 10).toFixed(1)}px)`;
  }
  const tris = renderer.info.render.triangles, calls = renderer.info.render.calls, pts = renderer.info.render.points, lns = renderer.info.render.lines;
  document.getElementById('info').textContent = `build ${buildMs.toFixed(0)} ms · ${calls} calls · ${tris} tris · ${pts} pts · ${lns} lines · t=${t.toFixed(2)}`;
  window.__stats = { buildMs, calls, tris, pts, lns, frameMs: ms / frames };
  window.__ready = true;
  if (Q.get('anim') || frames < 3) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
