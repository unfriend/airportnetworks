<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Set harness</title>
<style>
html, body { margin: 0; background: #040912; overflow: hidden; font-family: sans-serif; }
canvas { display: block; }
.l { position: absolute; left: 0; top: 0; color: #e7eef8; font: 13px/1.25 sans-serif; background: rgba(3,8,16,0.82); padding: 3px 7px 3px 6px;
  border-left: 3px solid #9fb0c6; white-space: nowrap; pointer-events: none; border-radius: 3px; }
.l b { margin-right: 6px; } .l.mag { border-color: #ff5ad9; } .l.amb { border-color: #ffb43b; } .l.grn { border-color: #3ee08f; } .l.cyn { border-color: #46d9ff; }
#info { position: absolute; right: 8px; bottom: 6px; color: #6c7d94; font: 12px monospace; }
</style>
<script src="../../../three.min.js"></script>
<script src="../../../tools/engine/kit.js"></script>
<script src="../../../ik.js"></script>
<script>
// Test harness for the guide (serve the repository root, open /packages/tutorial/src/harness.html):
// harness.html?set=guide&t=60&cam=-8,12,2.48,0.35,1.1,-2&fov=58&anim=1 (t: story seconds; anim: run in real time;
// mode=1: practice; nofvt: the plain figure). The guide's body comes from bodies.js, loaded here as the shell loads it.
const SETS = {};
const Q = new URLSearchParams(location.search);
window.HOST = {};
document.write(`<script src="../../../bodies.js?v=${Date.now()}"><\/script>`);
document.write(`<script src="sets/script.js?v=${Date.now()}"><\/script>`);
document.write(`<script src="sets/${Q.get('set') || 'guide'}.js?v=${Date.now()}"><\/script>`);
</script>
</head><body>
<div id="info"></div>
<script>
'use strict';
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message)));
const K = makeKit(THREE);
const key = Q.get('set') || 'guide';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
renderer.setClearColor(0x040912, 1);
HOST.renderer = renderer;
HOST.needBodies = () => Promise.resolve(!!(HOST.bodies && HOST.bodies.can(renderer)));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(+(Q.get('fov') || 58), W / H, 0.05, 3000);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x1a2233, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-0.5, 0.6, 1); camera.add(sun);
const t0 = performance.now();
const set = SETS[key](K);
const buildMs = performance.now() - t0;
scene.add(set.group);
const S = Object.assign({}, set.params);
S[key + '_a'] = 1;
if (Q.get('mode')) S.guide_mode = +Q.get('mode');
for (const kv of (Q.get('p') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); S[k] = parseFloat(v); }
const camArr = (Q.get('cam') ? Q.get('cam').split(',').map(Number) : set.cam[Q.get('view') || 'default']);
function place(c) {
  const [az, el, d, tx, ty, tz] = c, A = az * Math.PI / 180, E = el * Math.PI / 180;
  camera.position.set(tx + d * Math.cos(E) * Math.sin(A), ty + d * Math.sin(E), tz + d * Math.cos(E) * Math.cos(A));
  camera.up.set(0, 1, 0); camera.lookAt(tx, ty, tz);
}
const labels = (set.labels || []).map(L => { const el = document.createElement('div'); el.className = 'l ' + (L.cls || ''); document.body.appendChild(el); return { L, el }; });
const anchor = a => (typeof a === 'function' ? a() : typeof a === 'string' ? (typeof set.anchors[a] === 'function' ? set.anchors[a]() : set.anchors[a]) : a);
let t = parseFloat(Q.get('t') || '0'), last = performance.now(), frames = 0, ms = 0;
const v = new THREE.Vector3();
// (the figure is warmed up to t: the first frames wait for bodies.js, then run the second before t)
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (Q.get('anim')) t += dt;
  K.U.uTime.value = t;
  K.U.uPx.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y * 0.5;
  place(camArr);
  set.setAlpha(1);
  S.guide_clock = t;
  const a = performance.now();
  set.see({ head: Q.get('eye') ? Q.get('eye').split(',').map(Number) : [0, 1.6, 0] });
  set.update(S, t, Q.get('mode') ? 1 / 30 : dt);
  renderer.render(scene, camera);
  ms += performance.now() - a; frames++;
  for (const { L, el } of labels) {
    const [b, r] = typeof L.text === 'function' ? L.text() : L.text, al = L.alpha ? L.alpha(S) : 1;
    el.innerHTML = `<b>${b}</b>${r || ''}`;
    el.style.opacity = b ? al : 0;
    if (al <= 0) continue;
    const p = anchor(L.at);
    v.set(p[0], p[1], p[2]).applyMatrix4(set.group.matrixWorld).project(camera);
    el.style.transform = `translate(${((v.x * 0.5 + 0.5) * W + 8).toFixed(1)}px, ${((-v.y * 0.5 + 0.5) * H - 10).toFixed(1)}px)`;
  }
  const tris = renderer.info.render.triangles, calls = renderer.info.render.calls;
  document.getElementById('info').textContent = `${set.figure()} · build ${buildMs.toFixed(0)} ms · ${calls} calls · ${tris} tris · t=${t.toFixed(2)}`;
  window.__stats = { figure: set.figure(), buildMs, calls, tris, frameMs: ms / frames, state: set.state() };
  if (set.figure() !== 'wait' && frames > 3) window.__ready = true;
  if (Q.get('anim') || frames < 6 || set.figure() === 'wait') requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
